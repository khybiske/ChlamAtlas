name: Supabase Keep-Alive

on:
  schedule:
    # Mon/Wed/Fri at 09:17 UTC. Supabase pauses free projects after 7 idle days
    # and GitHub can start scheduled runs hours late, so a weekly run isn't enough.
    - cron: '17 9 * * 1,3,5'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ihobumwetoidqioifknt.supabase.co/rest/v1/strains?select=id&limit=1" \
            -H "apikey: sb_publishable_ONFzRadujAFsi2mVGTmCvA_pK61sODL" \
            -H "Authorization: Bearer sb_publishable_ONFzRadujAFsi2mVGTmCvA_pK61sODL")
          echo "Supabase ping status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
