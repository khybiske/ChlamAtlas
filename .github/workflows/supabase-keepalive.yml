name: Supabase Keep-Alive

on:
  schedule:
    # Every 6 hours. Supabase pauses free projects after a week of "too little
    # database activity" (threshold undocumented); read-only pings three times a
    # week drew a pause warning on a sibling project, so this writes a few times a day.
    - cron: '17 */6 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ihobumwetoidqioifknt.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Write heartbeat
        run: |
          [ -n "$SUPABASE_KEY" ] || { echo "SUPABASE_SERVICE_KEY secret is not set"; exit 1; }
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STATUS=$(curl -s -o body.json -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
            -X PATCH "$SUPABASE_URL/rest/v1/keepalive_heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"last_ping_at\":\"$NOW\"}") || true
          echo "Supabase heartbeat status: $STATUS"
          cat body.json; echo
          [ "$STATUS" = "200" ] && grep -q '"id":1' body.json
